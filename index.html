<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luna &amp; Asociados · Brinatti &amp; Asociados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="landing">

  <main class="split">

    <!-- LADO IZQUIERDO · LUNA -->
    <a href="contable.html" class="side side--luna" aria-label="Ingresar a Luna y Asociados">
      <div class="side__bg side__bg--luna"></div>
      <div class="side__content">
        <div class="side__top">
          <span class="side__kicker">Estudio Contable</span>
        </div>
        <div class="side__center">
          <div class="side__mark">
            <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <circle cx="30" cy="30" r="22" fill="none" stroke="currentColor" stroke-width="0.8"/>
              <path d="M 38 14 A 22 22 0 1 0 38 46 A 18 18 0 1 1 38 14 Z" fill="currentColor"/>
            </svg>
          </div>
          <h1 class="side__name">
            <span class="side__name-first">Luna</span>
            <span class="side__name-amp">&amp;</span>
            <span class="side__name-last">Asociados</span>
          </h1>
          <p class="side__tag">Solidez en cada cifra.</p>
        </div>
        <div class="side__bottom">
          <span class="side__enter">
            Ingresar
            <svg viewBox="0 0 24 12" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M0 6 L22 6 M16 1 L22 6 L16 11" fill="none" stroke="currentColor" stroke-width="1.2"/>
            </svg>
          </span>
        </div>
      </div>
    </a>

    <!-- DIVISOR -->
    <div class="divider" aria-hidden="true">
      <span class="divider__line"></span>
      <span class="divider__dot"></span>
      <span class="divider__line"></span>
    </div>

    <!-- LADO DERECHO · BRINATTI -->
    <a href="financiero.html" class="side side--brinatti" aria-label="Ingresar a Brinatti y Asociados">
      <div class="side__bg side__bg--brinatti"></div>
      <div class="side__content">
        <div class="side__top">
          <span class="side__kicker">Estudio Financiero</span>
        </div>
        <div class="side__center">
          <div class="side__mark">
            <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M 8 48 L 22 30 L 32 38 L 52 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M 44 12 L 52 12 L 52 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h1 class="side__name">
            <span class="side__name-first">Brinatti</span>
            <span class="side__name-amp">&amp;</span>
            <span class="side__name-last">Asociados</span>
          </h1>
          <p class="side__tag">Capital con visión estratégica.</p>
        </div>
        <div class="side__bottom">
          <span class="side__enter">
            Ingresar
            <svg viewBox="0 0 24 12" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M0 6 L22 6 M16 1 L22 6 L16 11" fill="none" stroke="currentColor" stroke-width="1.2"/>
            </svg>
          </span>
        </div>
      </div>
    </a>

  </main>

  <footer class="landing__footer">
    <span class="landing__footer-mid">Elegí un estudio para comenzar</span>
  </footer>

<script src="main.js"></script>
</body>
</html>
